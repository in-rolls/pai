name: Release data

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: make check
      - run: make verify-data
      - name: Check tag and package version
        run: >-
          uv run python -c "import os,tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}'"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          data/release/pai_gp.parquet
          data/release/MANIFEST.json
          --verify-tag --generate-notes
