[project]
name = "pai-scraper"
version = "0.2.1"
description = "Scraper and data tools for the Panchayat Advancement Index (PAI) Gram Panchayat scores"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
keywords = ["india", "panchayat", "local government", "governance", "data"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "filelock>=3.32.5",
    "playwright>=1.45",
    "pyarrow>=18",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/in-rolls/pai"
Repository = "https://github.com/in-rolls/pai"
Issues = "https://github.com/in-rolls/pai/issues"
Changelog = "https://github.com/in-rolls/pai/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "huggingface-hub>=1.30.0",
]

# Scripts-only application: uv manages the environment but does not build/install
# this project as a package (the tools live under scripts/, run via `uv run`).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
